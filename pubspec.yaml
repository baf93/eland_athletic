name: eland_athletic
description: "Eland Athletic fitness platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  sqflite: ^2.4.0+1
  path: ^1.9.1
  shared_preferences: ^2.0.15
  package_info_plus: ^10.0.1
  url_launcher: ^6.3.2
  permission_handler: ^12.0.3
  wakelock_plus: ^1.6.1
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^22.0.1
  audioplayers: ^6.7.1
  vibration: ^3.2.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.0
  flutter_flavorizr: ^2.5.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flavorizr:
  app:
    android:
      flavorDimensions: "flavor-type"
    ios:
      buildTargets:
        Runner:
          buildSettings:
            PRODUCT_BUNDLE_IDENTIFIER: "com.eland.athletic" # Bundle base

  # Definisci i flavor qui
  flavors:
    userApp:
      app:
        name: "Eland Athletic"
      android:
        applicationId: "com.eland.athletic.user"
        # Importante: specifica il dimension se necessario
        flavorDimension: "flavor-type"
      ios:
        bundleId: "com.eland.athletic.user"

    proApp:
      app:
        name: "Eland Pro"
      android:
        applicationId: "com.eland.athletic.pro"
        flavorDimension: "flavor-type"
      ios:
        bundleId: "com.eland.athletic.pro"

flutter:
  uses-material-design: true
  assets:
    - assets/audio/